<!doctype html>
<html lang="it" data-theme="crimson">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fantasia</title>
    <meta
      name="description"
      content="Fantasia — plancia di comando per sessioni di gioco di ruolo: partecipanti, lancio dadi, barre della vita, schede giocatore e schermo condiviso."
    />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="color-scheme" content="dark" />

    <!-- App installabile: il manifest la rende aggiungibile alla schermata
         principale e il service worker (registrato da main.tsx, solo in
         produzione) la fa aprire anche senza rete. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fantasia" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icona della scheda. Due misure: quella da 32 pixel è disegnata per
         essere leggibile piccolissima, la grande serve a schede espanse,
         segnalibri e collegamenti sul desktop. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- I font erano caricati con @import dentro il CSS: richiesta serializzata,
         render bloccante e nessun preconnect. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Ogni design ha il suo carattere: Press Start 2P/VT323 per Retro,
         Orbitron per Neon, Oswald condensato per Ferro, Bangers per Fumetto.
         È l'unico modo per cambiare davvero la sensazione dell'interfaccia,
         non solo le forme. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;600;700;800&family=Oswald:wght@400;500;600;700&family=Press+Start+2P&family=VT323&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
